<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 35 - Projects</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-theme="dark">
  <nav>
    <span class="brand">Flask + MySQL</span>
    <div class="links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="{{ url_for('projects_page') }}" class="active">Projects</a>
      <a href="{{ url_for('contact') }}">Contact</a>
    </div>
    <button id="themeToggle">☀️</button>
  </nav>

  <main>
    <h1>Projects</h1>
    <p class="subtitle">Full CRUD — add, edit, and delete, backed by MySQL through the Flask REST API.</p>

    <div id="projectList"></div>

    <h2 id="formTitle" style="margin-top:32px;">Add a New Project</h2>
    <form class="card" id="projectForm">
      <input type="hidden" id="projectId">
      <input type="text" id="projectTitle" placeholder="Project title" required>
      <textarea id="projectDescription" rows="3" placeholder="Short description" required></textarea>
      <input type="text" id="projectTech" placeholder="Tech stack (e.g. Flask, MySQL)">
      <input type="text" id="projectGithub" placeholder="GitHub URL (optional)">
      <p id="formStatus"></p>
      <div class="card-actions">
        <button type="submit" class="btn-primary">Save Project</button>
        <button type="button" id="cancelEdit" class="btn-edit" style="display:none;">Cancel Edit</button>
      </div>
    </form>
  </main>

  <footer>Day 35 — Innolift Ventures, Crescent Batch</footer>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/projects.js') }}"></script>
</body>
</html>
