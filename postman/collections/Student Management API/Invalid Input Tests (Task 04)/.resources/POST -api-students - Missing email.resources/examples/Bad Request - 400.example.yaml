$kind: http-example
request:
  url: "{{base_url}}/api/students"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "name": "Test Student",
        "course": "IT"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Name, email and course are all required",
        "success": false
      }
order: 1000
