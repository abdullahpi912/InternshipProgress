$kind: http-example
request:
  url: "{{base_url}}/api/predict"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "N": 100,
        "P": 82,
        "K": 50,
        "temperature": 27.4,
        "humidity": 80.3,
        "ph": 5.9,
        "rainfall": 104.6
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "prediction": "banana",
        "success": true
      }
order: 1000
