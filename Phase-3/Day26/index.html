<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriSense — Registration Form Validation Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="form-page">
  <form class="register-card" id="registerForm" novalidate>
    <h1>Create your AgriSense account</h1>
    <p class="form-subtitle">Day 26 self-study — HTML5, JavaScript &amp; Regex validation</p>

    <div class="field">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required minlength="3" maxlength="30">
      <span class="error-msg" id="fullNameError"></span>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
      <span class="error-msg" id="emailError"></span>
    </div>

    <div class="field">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required placeholder="10-digit mobile number">
      <span class="error-msg" id="phoneError"></span>
    </div>

    <div class="field">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required>
      <span class="error-msg" id="dobError"></span>
    </div>

    <div class="field">
      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="" disabled selected>Select gender</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
        <option value="unspecified">Prefer not to say</option>
      </select>
      <span class="error-msg" id="genderError"></span>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8">
      <div class="strength-meter" id="strengthMeter">
        <div class="strength-bar" id="strengthBar"></div>
      </div>
      <span class="strength-label" id="strengthLabel"></span>
      <span class="error-msg" id="passwordError"></span>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
      <span class="error-msg" id="confirmPasswordError"></span>
    </div>

    <button type="submit" class="submit-btn">Create account</button>
    <p class="success-msg" id="successMsg">Account details look good — form is ready to submit.</p>
  </form>
</main>

<script src="script.js"></script>
</body>
</html>
